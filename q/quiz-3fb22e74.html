<div id="gtq3fb22e74" class="gtq">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
#gtq3fb22e74{--g:#58cc02;--gd:#46a302;--gl:#d7ffb8;--b:#1cb0f6;--bd:#1899d6;--bl:#ddf4ff;--r:#ff4b4b;--rd:#ea2b2b;--rl:#ffdfe0;--y:#ffc800;--ink:#3c3c3c;--mu:#777;--ln:#e5e5e5;
  font-family:"Nunito","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);font-weight:700;line-height:1.5;-webkit-font-smoothing:antialiased}
#gtq3fb22e74 *{box-sizing:border-box;margin:0;padding:0}
/* 화면 높이에 딱 맞춘다: 주소창이 있어도 보이는 영역(dvh) 기준 */
#gtq3fb22e74 .q-wrap{max-width:520px;margin:0 auto;height:100vh;height:100dvh;max-height:760px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
#gtq3fb22e74 .q-head{display:flex;align-items:center;gap:12px;padding:10px 16px 6px;flex-shrink:0}
#gtq3fb22e74 .q-logo{width:78px;flex-shrink:0;line-height:0}
#gtq3fb22e74 .q-logo svg,#gtq3fb22e74 .q-logo img{width:100%;height:auto;display:block}
#gtq3fb22e74 .q-prog{flex:1;height:12px;background:var(--ln);border-radius:99px;overflow:hidden}
#gtq3fb22e74 .q-prog i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .4s;position:relative}
#gtq3fb22e74 .q-prog i:after{content:"";position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:9px;background:rgba(255,255,255,.35)}
#gtq3fb22e74 .q-body{flex:1;min-height:0;overflow-y:auto;padding:clamp(8px,2.2vh,20px) 16px 8px;display:flex;flex-direction:column}
#gtq3fb22e74 .q-foot{flex-shrink:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom));transition:background .2s}
#gtq3fb22e74 .q-foot.ok{background:var(--gl)}
#gtq3fb22e74 .q-foot.bad{background:var(--rl)}
#gtq3fb22e74 .q-fb{display:none;margin-bottom:10px}
#gtq3fb22e74 .q-foot.ok .q-fb,#gtq3fb22e74 .q-foot.bad .q-fb{display:block}
#gtq3fb22e74 .q-fb b{display:block;font-size:17px;font-weight:900}
#gtq3fb22e74 .q-foot.ok .q-fb b{color:var(--gd)}
#gtq3fb22e74 .q-foot.bad .q-fb b{color:var(--rd)}
#gtq3fb22e74 .q-fb p{font-size:13.5px;line-height:1.5;font-weight:500;margin-top:2px;color:var(--ink);font-family:"Noto Sans KR",sans-serif;max-height:7.5em;overflow-y:auto}
#gtq3fb22e74 .q-btn{display:block;width:100%;border:none;border-radius:14px;padding:clamp(10px,1.7vh,14px) 16px;font:inherit;font-weight:900;font-size:15px;letter-spacing:.3px;cursor:pointer;color:#fff;background:var(--g);box-shadow:0 4px 0 var(--gd);text-align:center;text-decoration:none;transition:filter .1s,transform .05s}
#gtq3fb22e74 .q-btn:hover{filter:brightness(1.05)}
#gtq3fb22e74 .q-btn:active{transform:translateY(4px);box-shadow:none}
#gtq3fb22e74 .q-btn[disabled]{background:var(--ln);box-shadow:0 4px 0 #d0d0d0;color:#afafaf;cursor:default;transform:none}
#gtq3fb22e74 .q-btn.red{background:var(--r);box-shadow:0 4px 0 var(--rd)}
#gtq3fb22e74 .q-btn.blue{background:var(--b);box-shadow:0 4px 0 var(--bd)}
#gtq3fb22e74 .q-btn.white{background:#fff;color:var(--b);border:2px solid var(--ln);box-shadow:0 4px 0 var(--ln)}
#gtq3fb22e74 .q-kind{font-size:12px;font-weight:900;color:var(--b);margin-bottom:4px}
#gtq3fb22e74 .q-title{font-size:clamp(16px,2.5vh,20px);font-weight:900;line-height:1.4;margin-bottom:clamp(10px,2vh,18px);word-break:keep-all;font-family:"Noto Sans KR",sans-serif}
#gtq3fb22e74 .q-opts{display:flex;flex-direction:column;gap:clamp(6px,1.2vh,10px)}
#gtq3fb22e74 .q-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--ln);border-radius:14px;background:#fff;padding:clamp(8px,1.5vh,13px) 12px;font:inherit;font-size:clamp(14px,2vh,16px);line-height:1.35;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--ln);font-family:"Noto Sans KR",sans-serif;color:var(--ink);word-break:keep-all}
#gtq3fb22e74 .q-opt .n{flex-shrink:0;width:24px;height:24px;border:2px solid var(--ln);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--mu);font-family:Nunito,sans-serif}
#gtq3fb22e74 .q-opt:hover{background:#f7f7f7}
#gtq3fb22e74 .q-opt.sel{border-color:#84d8ff;background:var(--bl);color:var(--bd);box-shadow:0 3px 0 #84d8ff}
#gtq3fb22e74 .q-opt.sel .n{border-color:#84d8ff;color:var(--bd)}
#gtq3fb22e74 .q-opt.right{border-color:var(--g);background:var(--gl);color:var(--gd);box-shadow:0 3px 0 var(--g)}
#gtq3fb22e74 .q-opt.wrong{border-color:var(--r);background:var(--rl);color:var(--rd);box-shadow:0 3px 0 var(--r)}
#gtq3fb22e74 .q-opt[disabled]{cursor:default}
#gtq3fb22e74 .q-ox{flex-direction:row}
#gtq3fb22e74 .q-ox .q-opt{flex-direction:column;justify-content:center;padding:clamp(12px,3vh,24px) 8px;font-size:clamp(34px,6vh,48px);line-height:1;font-weight:900;font-family:Nunito,sans-serif}
#gtq3fb22e74 .q-ox .q-opt.o{color:var(--b)} #gtq3fb22e74 .q-ox .q-opt.x{color:var(--r)}
#gtq3fb22e74 .q-sent{font-size:clamp(16px,2.4vh,19px);line-height:1.9;font-family:"Noto Sans KR",sans-serif;font-weight:700;margin-bottom:clamp(10px,2vh,20px);word-break:keep-all}
#gtq3fb22e74 .q-slot{display:inline-block;min-width:72px;border-bottom:3px solid var(--ink);text-align:center;padding:0 6px;margin:0 3px;color:var(--bd);line-height:1.5}
#gtq3fb22e74 .q-chips{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;justify-content:center}
#gtq3fb22e74 .q-chips .q-opt{width:auto;padding:clamp(8px,1.4vh,11px) 14px}
#gtq3fb22e74 .q-center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:clamp(4px,1vh,8px)}
#gtq3fb22e74 .q-hero{font-size:clamp(40px,7vh,60px);line-height:1}
#gtq3fb22e74 .q-big{font-size:clamp(19px,3vh,24px);font-weight:900;line-height:1.35;font-family:"Noto Sans KR",sans-serif;word-break:keep-all}
#gtq3fb22e74 .q-sub{color:var(--mu);font-size:14px;font-weight:500;font-family:"Noto Sans KR",sans-serif;word-break:keep-all}
#gtq3fb22e74 .q-score{display:flex;gap:8px;justify-content:center;margin:2px 0}
#gtq3fb22e74 .q-score span{border-radius:99px;padding:4px 12px;font-size:13px;font-weight:900;background:#fff4cc;color:#c99700}
#gtq3fb22e74 .q-score span.g{background:var(--gl);color:var(--gd)}
#gtq3fb22e74 .q-links{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px);width:100%;margin-top:clamp(6px,1.6vh,14px)}
#gtq3fb22e74 .q-again{background:none;border:none;font:inherit;color:var(--mu);font-size:13px;font-weight:800;cursor:pointer;margin-top:2px;text-decoration:underline}
#gtq3fb22e74 .q-streak{color:#ff9600;font-weight:900;font-size:13px}
#gtq3fb22e74 .q-pop{animation:gtq3fb22e74pop .35s ease}
@keyframes gtq3fb22e74pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
/* 데스크톱: 카드 형태 */
@media (min-width:600px) and (min-height:700px){
  #gtq3fb22e74 .q-wrap{height:min(720px,100dvh);margin:16px auto;border:2px solid var(--ln);border-radius:20px}
  #gtq3fb22e74 .q-head{padding:14px 20px 8px}
  #gtq3fb22e74 .q-logo{width:100px}
  #gtq3fb22e74 .q-body{padding:18px 22px 10px}
  #gtq3fb22e74 .q-foot{padding:14px 22px 18px}
}
</style>

<script>
(function () {
  var root = document.getElementById("gtq3fb22e74");
  var Q = JSON.parse(root.querySelector(".q-data").textContent);
  var body = root.querySelector(".q-body"), foot = root.querySelector(".q-foot"), btn = foot.querySelector(".q-btn");
  var fbB = foot.querySelector(".q-fb b"), fbP = foot.querySelector(".q-fb p"), bar = root.querySelector(".q-prog i");
  var wrap = root.querySelector(".q-wrap");
  var i = 0, sel = -1, checked = false, score = 0, run = 0;

  /* 임웹처럼 사이트 헤더가 화면 위에 고정돼 있으면 그만큼 빼고, 남은 화면에 퀴즈를 딱 맞춘다 */
  // 화면 맨 위에 붙어 있는 헤더 높이. 화면을 덮는 팝업·배너(높이 40% 이상)는 헤더가 아니므로 건너뛴다.
  function fixedTop() {
    var stack = document.elementsFromPoint ? document.elementsFromPoint(window.innerWidth / 2, 2) : [];
    for (var k = 0; k < stack.length; k++) {
      var el = stack[k];
      while (el && el !== document.body && el !== document.documentElement) {
        if (root.contains(el)) return 0;
        var pos = getComputedStyle(el).position, b = el.getBoundingClientRect();
        if ((pos === "fixed" || pos === "sticky") && b.top <= 1 && b.height < window.innerHeight * 0.4) {
          return Math.max(0, Math.min(b.bottom, 160));
        }
        el = el.parentElement;
      }
    }
    return 0;
  }
  function fit() {
    if (window.self !== window.top) return;            // iframe 안이면 CSS 높이에 맡긴다
    if (window.matchMedia("(min-width:600px) and (min-height:700px)").matches) { wrap.style.height = ""; return; }
    wrap.style.height = Math.max(420, window.innerHeight - fixedTop()) + "px";
  }
  function focusQuiz() {
    if (window.self !== window.top) return;
    fit();
    var y = root.getBoundingClientRect().top + window.pageYOffset - fixedTop();
    window.scrollTo(0, y);
  }
  fit();
  window.addEventListener("resize", fit);
  var KIND = { mc: "알맞은 답을 고르세요", ox: "O / X 로 답하세요", blank: "빈칸에 들어갈 말을 고르세요" };
  var CHEER = ["정답이에요! 🎉", "훌륭해요! 👏", "완벽해요! ✨", "멋져요! 🐾"];

  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function setFoot(cls, label, color, disabled) {

  }

  function start() {
    i = 0; score = 0; run = 0; bar.style.width = "0%";

    btn.onclick = function () { focusQuiz(); show(); };
  }

  function show() {
    var q = Q.questions[i]; sel = -1; checked = false;
    bar.style.width = (i / Q.questions.length * 100) + "%";
    var h = '<div class="q-kind">' + (i + 1) + ' / ' + Q.questions.length + ' · ' + KIND[q.type] + '</div>';
    if (q.type === "blank") {
      var parts = String(q.question).split("___");
      h += '<div class="q-sent">' + esc(parts[0]) + '<span class="q-slot">&nbsp;</span>' + esc(parts.slice(1).join("___")) + '</div><div class="q-opts q-chips">';
    } else {
      h += '<div class="q-title">' + esc(q.question) + '</div><div class="q-opts' + (q.type === "ox" ? " q-ox" : "") + '">';
    }
    q.options.forEach(function (o, k) {
      var extra = q.type === "ox" ? (k === 0 ? " o" : " x") : "";
      var num = q.type === "mc" ? '<span class="n">' + (k + 1) + '</span>' : "";
      h += '<button type="button" class="q-opt' + extra + '" data-k="' + k + '">' + num + '<span>' + esc(o) + '</span></button>';

    body.innerHTML = h + '</div>';
    body.querySelectorAll(".q-opt").forEach(function (b) {
      b.onclick = function () {
        if (checked) return;

        var slot = body.querySelector(".q-slot"); if (slot) slot.textContent = q.options[sel];
        btn.disabled = false;
      };
    });
    setFoot("", "확인", "", true);
    btn.onclick = check;
  }

  function check() {
    if (sel < 0) return;
    var q = Q.questions[i], ok = sel === q.answer_index; checked = true;
    var opts = body.querySelectorAll(".q-opt");
    opts.forEach(function (x, k) {
      x.disabled = true; x.classList.remove("sel");
      if (k === q.answer_index) x.classList.add("right"); else if (k === sel) x.classList.add("wrong");
    });
    if (ok) { score++; run++; } else run = 0;
    bar.style.width = ((i + 1) / Q.questions.length * 100) + "%";
    fbB.innerHTML = ok ? esc(CHEER[i % CHEER.length]) + (run >= 2 ? '<div class="q-streak">🔥 ' + run + '연속 정답!</div>' : "")
                       : (q.options[q.answer_index].length <= 12 ? "아쉬워요! 정답: " + esc(q.options[q.answer_index]) : "아쉬워요! 초록색이 정답이에요");
    fbP.textContent = q.explanation || "";
    setFoot(ok ? "ok" : "bad", i + 1 < Q.questions.length ? "계속" : "결과 보기", ok ? "" : "red");
    btn.onclick = function () { i++; if (i < Q.questions.length) show(); else end(); };
  }

  function end() {
    var n = Q.questions.length, pct = Math.round(score / n * 100);
    var msg = pct === 100 ? ["🏆", "만점이에요!", "우리 아이 건강 박사님이시네요."]
            : pct >= 60 ? ["🎉", "퀴즈 완료!", "핵심을 잘 알고 계세요. 조금만 더 알아볼까요?"]

      '<div class="q-links">' + links + '</div>' +
      '<button type="button" class="q-again">다시 풀기</button></div>';
    body.querySelector(".q-again").onclick = start;
    foot.style.display = "none";
  }

  start();
})();
</script>
